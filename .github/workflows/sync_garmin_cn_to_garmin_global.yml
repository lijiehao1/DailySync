name: Sync Garmin CN to Garmin Global

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of recent activities to compare
        required: true
        default: "30"
        type: string
      dry_run:
        description: Preview without uploading
        required: true
        default: false
        type: boolean
  schedule:
    # Four times daily. GitHub cron uses UTC.
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: garmin-cn-to-global
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      GARMIN_GLOBAL_USERNAME: ${{ secrets.GARMIN_GLOBAL_USERNAME }}
      GARMIN_GLOBAL_PASSWORD: ${{ secrets.GARMIN_GLOBAL_PASSWORD }}
      GARMIN_SYNC_VERSION: 5f277d889bff435a84f00ebb1c902cb0991682b9

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in GARMIN_USERNAME GARMIN_PASSWORD GARMIN_GLOBAL_USERNAME GARMIN_GLOBAL_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]]

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Build pinned Garmin sync client
        shell: bash
        run: |
          set -euo pipefail
          go install "github.com/Andrewshihs/garmin-sync/cmd/garmin@${GARMIN_SYNC_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Authenticate both regions
        shell: bash
        run: |
          set -euo pipefail
          config_dir="$RUNNER_TEMP/garmin-sync"
          mkdir -m 700 "$config_dir"

          printf '%s' "$GARMIN_PASSWORD" |
            garmin --config-dir "$config_dir" auth login \
              --profile cn --region cn --email "$GARMIN_USERNAME" --password-stdin

          printf '%s' "$GARMIN_GLOBAL_PASSWORD" |
            garmin --config-dir "$config_dir" auth login \
              --profile global --region global --email "$GARMIN_GLOBAL_USERNAME" --password-stdin

      - name: Sync activities
        shell: bash
        env:
          INPUT_LIMIT: ${{ inputs.limit || '30' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_LIMIT" =~ ^[1-9][0-9]*$ ]] || (( INPUT_LIMIT > 500 )); then
            echo "::error::limit must be an integer from 1 to 500"
            exit 1
          fi

          args=(
            --config-dir "$RUNNER_TEMP/garmin-sync"
            sync
            --source cn
            --target global
            --source-region cn
            --target-region global
            --limit "$INPUT_LIMIT"
            --delay 5
          )
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          garmin "${args[@]}"

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/garmin-sync"
